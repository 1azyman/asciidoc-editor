<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AsciiDoc editor demo</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #eef0f3;
        }

        .page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            align-items: start;
        }

        #editor .adoc-editor {
            min-height: 70vh;
            max-height: 85vh;
        }

        #output {
            margin: 0;
            padding: 1rem;
            min-height: 70vh;
            max-height: 85vh;
            overflow: auto;
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="controls">
        <strong>AsciiDoc editor demo</strong>
        <label><input type="checkbox" id="dark"/> dark</label>
        <label><input type="checkbox" id="readonly"/> read only</label>
        <button id="reset" type="button">Reset sample</button>
    </div>
    <div class="split">
        <div id="editor"></div>
        <pre id="output"></pre>
    </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
