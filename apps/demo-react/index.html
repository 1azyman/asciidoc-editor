<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AsciiDoc editor React demo</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #eef0f3;
        }

        .page {
            max-width: 1800px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            align-items: stretch;
        }

        /* Same fixed, border-box height on both panes so they line up. */
        .adoc-editor,
        textarea.raw {
            box-sizing: border-box;
            height: 80vh;
        }

        textarea.raw {
            width: 100%;
            resize: none;
            font-size: 13px;
            font-family: monospace;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 1rem;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
